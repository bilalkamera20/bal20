name: Nernur Guncelle

on:
  schedule:
    - cron: '0 */6 * * *' # 6 saatte bir otomatik çalışır
  workflow_dispatch: # Manuel tetikleme imkanı verir

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repoyu Çek
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Git geçmişini eksiksiz çeker (çakışmaları önler)

      - name: Node.js Kur
        uses: actions/setup-node@v4
        with:
          node-version: 20 # Fetch API uyumluluğu için Node 20

      - name: Scripti Çalıştır
        run: node index.js
        env:
          PROXY_BASE: ${{ secrets.PROXY_BASE }}

      - name: Değişiklik Varsa Commit et ve Pushla
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add nernur.txt
          git commit -m "chore: update nernur.txt ($(date -u +'%Y-%m-%d %H:%M UTC'))" || echo "Değişiklik yok"
          git pull --rebase origin main
          git push origin main
