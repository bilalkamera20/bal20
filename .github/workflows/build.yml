name: nernur liste

on:
  workflow_dispatch:
  schedule:
    - cron: '30 01 * * *'   # UTC 01:30 → TSİ 04:30
  push:
    branches: [main]
    paths:
      - "scripts/build.js"
      - ".github/workflows/build.yml"
      - "package.json"

concurrency:
  group: build-m3u
  cancel-in-progress: false

permissions:
  contents: write

env:
  ACTIONS_NODE20_DEPRECATION_WARNING: "false"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Proje
        uses: actions/checkout@v4

      - name: M3U Oluştur
        env:
          PROXY_BASE: ${{ vars.PROXY_BASE }}
        run: node scripts/build.js

      - name: Değişiklik Varsa Commit et ve Pushla
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -n "$(git status --porcelain iptv.m3u)" ]]; then
            git add iptv.m3u
            git commit -m "chore: update iptv.m3u ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          else
            echo "iptv.m3u üzerinde değişiklik yok."
          fi
