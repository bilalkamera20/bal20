name: nernur

on:
  workflow_dispatch:
  schedule:
    - cron: '30 01 * * *'   # UTC 01:30 → TSİ 04:30
  push:
    branches: [main]
    paths:
      - "balkica.js"

concurrency:
  group: balm3u
  cancel-in-progress: false

permissions:
  contents: write

env:
  ACTIONS_NODE20_DEPRECATION_WARNING: "false"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Proje
        uses: actions/checkout@v4

      - name: Oluştur
        env:
          PROXY_BASE: ${{ vars.PROXY_BASE }}
        run: node balkica.js

      - name: Değişiklik Varsa Commit et ve Pushla
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -n "$(git status ---porcelainnernur.txt)" ]]; then
            git aaddnernur.txt
            git commit -m "chore: uupdatenernur.txt ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          else
            echo "nernur.txt üzerinde değişiklik yok."
          fi
